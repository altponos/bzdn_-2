- name: Развертывание стенда мониторинга
  hosts: monitoring
  become: true

  tasks:
    - name: Установка вспомогательных пакетов
      ansible.builtin.apt:
        name: [ca-certificates, curl, gnupg]
        state: present
        update_cache: true
      tags: [docker]

    - name: Загрузка ключа репозитория Docker
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"
      tags: [docker]

    - name: Подключение репозитория Docker
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu noble stable"
        filename: docker
        state: present
      tags: [docker]

    - name: Установка Docker Engine
      ansible.builtin.apt:
        name: [docker-ce, docker-ce-cli, containerd.io, docker-compose-plugin]
        state: present
        update_cache: true
      tags: [docker]

    - name: Создание каталогов стенда
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ monitoring_dir }}"
        - "{{ monitoring_dir }}/prometheus"
      tags: [config]

    - name: Формирование конфигурации Prometheus из шаблона
      ansible.builtin.template:
        src: prometheus.yml.j2
        dest: "{{ monitoring_dir }}/prometheus/prometheus.yml"
        mode: "0644"
      tags: [config]

    - name: Формирование описания стека
      ansible.builtin.template:
        src: docker-compose.yml.j2
        dest: "{{ monitoring_dir }}/docker-compose.yml"
        mode: "0644"
      tags: [config]

    - name: Запуск стека мониторинга
      ansible.builtin.command:
        cmd: docker compose up -d
        chdir: "{{ monitoring_dir }}"
      register: compose_up
      changed_when: >
        'Started' in compose_up.stderr or
        'Created' in compose_up.stderr
      tags: [deploy]
